global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode http
    option httplog
    option forwardfor
    option http-server-close
    option logasap
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web_in
    bind *:80
    mode http
    
    # Detailed logging
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq {%{+Q}r}"
    
    # Capture request/response details
    capture request header User-Agent len 128
    capture request header Cookie len 256
    capture response header Content-Type len 64
    
    # Set request tracking
    http-request set-header X-Request-ID %{+X}o\ %pid-%t(%pid)-%{+X}o\ %Ts
    
    # Routing logic
    acl is_api path_beg /api/
    acl has_sid req.cook(sid) -m found
    use_backend %[req.cook(sid),map(/etc/haproxy/maps/session_routes.map,normal_api)] if is_api has_sid
    use_backend normal_api if is_api
    default_backend web_frontend

# Frontend service
backend web_frontend
    mode http
    balance roundrobin
    server frontend frontend:3000

# Real backend API (NORMAL MODE)
backend normal_api
    mode http
    balance roundrobin
    http-request set-header X-Forwarded-Service real-backend
    http-request set-header X-Request-Time %Ts
    server backend backend:5000

# Honeypot backends are available for session-level steering from map updates.
backend sqli_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server sqli sqli_pot:5000

backend ssti_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server ssti ssti_pot:5000

backend cmdi_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server cmdi cmdi_pot:5000

backend ssrf_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server ssrf ssrf_pot:5000

# Stats UI
frontend stats_in
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
    stats show-legends
    stats show-node
    stats admin if TRUE
