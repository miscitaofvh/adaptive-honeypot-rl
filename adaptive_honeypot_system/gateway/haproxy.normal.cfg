global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option forwardfor
    option http-server-close
    option logasap
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    default-server inter 3s fall 3 rise 2

frontend web_in
    bind *:80
    mode http
    
    # Detailed logging
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq {%{+Q}r}"
    
    # Capture request/response details
    capture request header User-Agent len 128
    capture request header Cookie len 256
    capture response header Content-Type len 64
    
    # Set request tracking
    http-request set-header X-Request-ID %{+X}o\ %pid-%t(%pid)-%{+X}o\ %Ts
    
    # Routing logic
    acl is_api path_beg /api/
    use_backend normal_api if is_api
    default_backend web_frontend

# Frontend service
backend web_frontend
    mode http
    balance roundrobin
    server frontend frontend:3000 check

# Real backend API (NORMAL MODE)
backend normal_api
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-request set-header X-Forwarded-Service real-backend
    http-request set-header X-Request-Time %Ts
    server backend backend:5000 check

# Stats UI
frontend stats_in
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
    stats show-legends
    stats show-node
    stats admin if TRUE
