global
    log filebeat:5140 len 8192 format rfc5424 local0 info
    maxconn 4096
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode http
    option httplog
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web_in
    bind *:80
    mode http

    log-format "{\"ts\":%Ts,\"event_type\":\"gateway_request\",\"service\":\"haproxy\",\"client_ip\":\"%ci\",\"frontend\":\"%ft\",\"backend\":\"%b\",\"server\":\"%s\",\"status\":%ST,\"bytes_out\":%B,\"bytes_in\":%U,\"method\":\"%HM\",\"path\":\"%HP\",\"query\":\"%HQ\",\"http_version\":\"%HV\",\"user_agent\":\"%[capture.req.hdr(0)]\",\"content_type\":\"%[capture.req.hdr(1)]\",\"content_length\":\"%[capture.req.hdr(2)]\",\"referer\":\"%[capture.req.hdr(3)]\",\"x_forwarded_for\":\"%[capture.req.hdr(4)]\",\"response_ms\":%Tr,\"total_ms\":%Ta,\"session_id\":\"%[var(txn.sid)]\",\"active_conn\":%ac}"

    # Capture request headers into indexed slots for log-format (slots 0-4)
    http-request capture req.hdr(User-Agent) len 512
    http-request capture req.hdr(Content-Type) len 100
    http-request capture req.hdr(Content-Length) len 20
    http-request capture req.hdr(Referer) len 200
    http-request capture req.hdr(X-Forwarded-For) len 50
    # Capture cookie into txn var so it is accessible in log-format (req.cook() needs HTTP headers context)
    http-request set-var(txn.sid) req.cook(sid)
    # Set request tracking
    http-request set-header X-Request-ID %{+X}o\ %pid-%t(%pid)-%{+X}o\ %Ts
    
    # Routing logic
    acl is_api path_beg /api/
    acl is_health path -i /api/health
    acl has_sid req.cook(sid) -m found
    acl is_cmdi path -i /api/tools/ping
    acl is_ssti path -i /api/tools/preview
    acl is_ssrf path -i /api/tools/fetch
    acl is_sqli path -i /api/articles/search

    acl session_route_sqli req.cook(sid),map(/etc/haproxy/maps/session_routes.map,endpoint_honeypot) -m str sqli_api
    acl session_route_ssti req.cook(sid),map(/etc/haproxy/maps/session_routes.map,endpoint_honeypot) -m str ssti_api
    acl session_route_cmdi req.cook(sid),map(/etc/haproxy/maps/session_routes.map,endpoint_honeypot) -m str cmdi_api
    acl session_route_ssrf req.cook(sid),map(/etc/haproxy/maps/session_routes.map,endpoint_honeypot) -m str ssrf_api

    acl ip_route_sqli src,map(/etc/haproxy/maps/ip_honeypot.map,endpoint_honeypot) -m str sqli_api
    acl ip_route_ssti src,map(/etc/haproxy/maps/ip_honeypot.map,endpoint_honeypot) -m str ssti_api
    acl ip_route_cmdi src,map(/etc/haproxy/maps/ip_honeypot.map,endpoint_honeypot) -m str cmdi_api
    acl ip_route_ssrf src,map(/etc/haproxy/maps/ip_honeypot.map,endpoint_honeypot) -m str ssrf_api

    use_backend health_api if is_api is_health

    # Session/IP overrides are still endpoint-scoped before falling back to
    # deterministic honeypot-by-endpoint routing.
    use_backend sqli_api if is_api has_sid is_sqli session_route_sqli
    use_backend ssti_api if is_api has_sid is_ssti session_route_ssti
    use_backend cmdi_api if is_api has_sid is_cmdi session_route_cmdi
    use_backend ssrf_api if is_api has_sid is_ssrf session_route_ssrf

    use_backend sqli_api if is_api is_sqli ip_route_sqli
    use_backend ssti_api if is_api is_ssti ip_route_ssti
    use_backend cmdi_api if is_api is_cmdi ip_route_cmdi
    use_backend ssrf_api if is_api is_ssrf ip_route_ssrf

    use_backend endpoint_honeypot if is_api
    default_backend web_frontend

# Frontend service
backend web_frontend
    mode http
    balance roundrobin
    server frontend frontend:3000

# Dedicated health backend so /api/health does not fall back to cmdi default.
backend health_api
    mode http
    http-request set-header X-Routed-By health-api
    server backend backend:5000

# Honeypot API (TESTING MODE) - Deterministic by endpoint unless session map overrides.
backend endpoint_honeypot
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By honeypot-gateway

    acl is_cmdi path -i /api/tools/ping
    acl is_ssti path -i /api/tools/preview
    acl is_ssrf path -i /api/tools/fetch
    acl is_sqli path -i /api/articles/search

    use-server cmdi if is_cmdi
    use-server ssti if is_ssti
    use-server ssrf if is_ssrf
    use-server sqli if is_sqli
    default-server check
    server cmdi cmdi_pot:5000
    server sqli sqli_pot:5000
    server ssti ssti_pot:5000
    server ssrf ssrf_pot:5000

backend sqli_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server sqli sqli_pot:5000

backend ssti_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server ssti ssti_pot:5000

backend cmdi_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server cmdi cmdi_pot:5000

backend ssrf_api
    mode http
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By session-map
    server ssrf ssrf_pot:5000

# Stats UI
frontend stats_in
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
    stats show-legends
    stats show-node
    stats admin if TRUE
