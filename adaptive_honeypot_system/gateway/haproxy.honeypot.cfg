global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option forwardfor
    option http-server-close
    option logasap
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web_in
    bind *:80
    mode http
    
    # Detailed logging
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq {%{+Q}r}"
    
    # Capture request/response details
    capture request header User-Agent len 128
    capture request header Cookie len 256
    capture response header Content-Type len 64
    
    # Set request tracking
    http-request set-header X-Request-ID %{+X}o\ %pid-%t(%pid)-%{+X}o\ %Ts
    
    # Routing logic
    acl is_api path_beg /api/
    use_backend honeypot_api if is_api
    default_backend web_frontend

# Frontend service
backend web_frontend
    mode http
    balance roundrobin
    server frontend frontend:3000

# Honeypot API (TESTING MODE) - Load balanced across 4 honeypots
backend honeypot_api
    mode http
    balance roundrobin
    http-request set-header X-Honeypot-Detection true
    http-request set-header X-Routed-By honeypot-gateway
    server cmdi cmdi_pot:5000
    server sqli sqli_pot:5000
    server ssti ssti_pot:5000
    server ssrf ssrf_pot:5000

# Stats UI
frontend stats_in
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin
    stats show-legends
    stats show-node
    stats admin if TRUE
