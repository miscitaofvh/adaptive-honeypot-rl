filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*-json.log
    parsers:
      - ndjson:
          target: "json"
          message_key: log
          add_error_key: true
    processors:
      # Extract container id from Docker log file path.
      - dissect:
          tokenizer: "/var/lib/docker/containers/%{id}/%{_container_log_file}"
          field: "log.file.path"
          target_prefix: "container"
          ignore_failure: true
      # Enrich with container.name and other metadata using container.id.
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
          match_source: true
          match_source_index: 4
          match_fields: ["container.id"]
      # Keep only data-plane logs.
      - drop_event:
          when:
            or:
              - regexp:
                  container.name: "^/?adaptive-(elasticsearch|kibana|filebeat|frontend)$"
              - regexp:
                  container.id: "^${HOSTNAME}"
              - regexp:
                  container.id: "^(3db3282f7882|2f5cbc6a7e8f|393230ce5c76)"
              - regexp:
                  log.file.path: "/var/lib/docker/containers/(3db3282f7882|2f5cbc6a7e8f|393230ce5c76)"
      # Keep raw application line in a standard searchable field.
      - copy_fields:
          fields:
            - from: "json.log"
              to: "message"
          fail_on_error: false
          ignore_missing: true
      # Parse honeypot JSON logs into app.* fields for Kibana querying.
      - decode_json_fields:
          when:
            contains:
              json.log: '"ts":'
          fields: ["json.log"]
          target: "app"
          overwrite_keys: false
          add_error_key: true

processors:
  - add_host_metadata:
      netinfo.enabled: true

output.elasticsearch:
  enabled: true
  hosts: ["elasticsearch:9200"]
  index: "honeypot-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.enabled: true
setup.template.name: "honeypot-logs"
setup.template.pattern: "honeypot-logs-*"

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

