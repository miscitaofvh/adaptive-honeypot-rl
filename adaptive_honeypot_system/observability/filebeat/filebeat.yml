filebeat.inputs:
  # HAProxy gateway logs (syslog over UDP)
  - type: syslog
    format: rfc5424
    protocol.udp:
      host: "0.0.0.0:5140"
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: "app"
          overwrite_keys: false
          add_error_key: true

  # Backend & honeypot service logs (raw UDP, port 5141)
  # Python SysLogHandler sends <priority>JSON — we strip the syslog
  # priority prefix with a script processor and decode the JSON payload.
  - type: udp
    host: "0.0.0.0:5141"
    processors:
      - script:
          lang: javascript
          source: |
            function process(event) {
              var msg = event.Get("message");
              if (msg && msg.charAt(0) === '<') {
                var gt = msg.indexOf('>');
                if (gt > 0) msg = msg.substring(gt + 1);
              }
              // strip trailing NUL byte from SysLogHandler
              if (msg && msg.charCodeAt(msg.length - 1) === 0) {
                msg = msg.substring(0, msg.length - 1);
              }
              event.Put("message", msg);
            }
      - decode_json_fields:
          fields: ["message"]
          target: "app"
          overwrite_keys: false
          add_error_key: true

processors:
  - drop_fields:
      fields:
        - agent
        - host
        - ecs
        - syslog
        - process
        - hostname
        - log
        - input
        - event
        - message
      ignore_missing: true

output.elasticsearch:
  enabled: true
  hosts: ["elasticsearch:9200"]
  index: "honeypot-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.enabled: false

logging.level: info
logging.to_stderr: true
