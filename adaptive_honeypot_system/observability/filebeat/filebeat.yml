filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    json.message_key: log
    json.add_error_key: true
    processors:
      - add_docker_metadata: ~
      # Drop logs from Elasticsearch, Kibana, Frontend - only keep gateway, backend, honeypots
      - drop_event:
          when:
            regexp:
              container.name: "^(adaptive-elasticsearch|adaptive-kibana|adaptive-frontend|adaptive-filebeat)$"

processors:
  - add_cloud_metadata: ~
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - add_host_metadata:
      netinfo.enabled: true
  - timestamp:
      field: "@timestamp"
      layouts:
        - unix_ms
        - "2006-01-02T15:04:05Z07:00"
        - iso8601
  - decode_json_fields:
      fields:
        - message
      target: "json"
      overwrite_keys: true

output.elasticsearch:
  enabled: true
  hosts: ["elasticsearch:9200"]
  index: "honeypot-logs-%{+yyyy.MM.dd}"
  ilm.enabled: false

setup.template:
  name: "honeypot-logs"
  pattern: "honeypot-logs-*"
  enabled: true

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

