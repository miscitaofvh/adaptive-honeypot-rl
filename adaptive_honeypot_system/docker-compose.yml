services:
  # ============================================================
  # GATEWAY - Unified L4/L7 Proxy with Advanced Logging
  # ============================================================

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: adaptive-gateway
    ports:
      - "18080:80"
      - "8404:8404"
    volumes:
      - haproxy_maps:/etc/haproxy/maps
      - haproxy_sock:/var/run/haproxy
    depends_on:
      - frontend
      - backend
      - cmdi_pot
      - sqli_pot
      - ssti_pot
      - ssrf_pot
    networks:
      - adaptive_net
    environment:
      - TZ=UTC
      - TEST_HONEYPOT=${TEST_HONEYPOT:-false}
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
    restart: unless-stopped

  # Real Service - Normal Backend
  backend:
    build:
      context: ./real_service/backend
      dockerfile: Dockerfile
    container_name: adaptive-backend
    environment:
      - SERVICE_NAME=real-backend
      - SECRET_KEY=${BACKEND_SECRET_KEY}
      - DATABASE_URL=sqlite:////data/meridian.db
      - FLASK_ENV=production
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - FILEBEAT_HOST=filebeat
      - FILEBEAT_SERVICE_PORT=5141
    volumes:
      - backend_data:/data
    networks:
      - adaptive_net
    restart: unless-stopped

  # Real Service - Frontend (React + Nginx)
  frontend:
    build:
      context: ./real_service/frontend
      dockerfile: Dockerfile
    container_name: adaptive-frontend
    networks:
      - adaptive_net
    restart: unless-stopped

  # Honeypots - Individual Detection Services
  cmdi_pot:
    build:
      context: ./honeypots
      dockerfile: cmdi_pot/Dockerfile
    container_name: adaptive-cmdi-pot
    ports:
      - "5002:5000"
    environment:
      - SERVICE_NAME=cmdi-honeypot
      - POT_TYPE=command-injection
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - FILEBEAT_HOST=filebeat
      - FILEBEAT_SERVICE_PORT=5141
    networks:
      - adaptive_net
    restart: unless-stopped

  sqli_pot:
    build:
      context: ./honeypots
      dockerfile: sqli_pot/Dockerfile
    container_name: adaptive-sqli-pot
    ports:
      - "5003:5000"
    environment:
      - SERVICE_NAME=sqli-honeypot
      - POT_TYPE=sql-injection
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - FILEBEAT_HOST=filebeat
      - FILEBEAT_SERVICE_PORT=5141
    networks:
      - adaptive_net
    restart: unless-stopped

  ssti_pot:
    build:
      context: ./honeypots
      dockerfile: ssti_pot/Dockerfile
    container_name: adaptive-ssti-pot
    ports:
      - "5004:5000"
    environment:
      - SERVICE_NAME=ssti-honeypot
      - POT_TYPE=template-injection
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - FILEBEAT_HOST=filebeat
      - FILEBEAT_SERVICE_PORT=5141
    networks:
      - adaptive_net
    restart: unless-stopped

  ssrf_pot:
    build:
      context: ./honeypots
      dockerfile: ssrf_pot/Dockerfile
    container_name: adaptive-ssrf-pot
    ports:
      - "5005:5000"
    environment:
      - SERVICE_NAME=ssrf-honeypot
      - POT_TYPE=server-side-request-forgery
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - FILEBEAT_HOST=filebeat
      - FILEBEAT_SERVICE_PORT=5141
    networks:
      - adaptive_net
    restart: unless-stopped

  # ============================================================
  # CONTROL PLANE - RL Agent + Routing Controller
  # ============================================================
  rl_agent:
    build:
      context: .
      dockerfile: control_plane/rl_agent/Dockerfile
    container_name: adaptive-rl-agent
    ports:
      - "8003:8003"
    environment:
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - RL_AGENT_INIT_MODE=${RL_AGENT_INIT_MODE:-web_policy}
      - RL_AGENT_AUTO_EXPORT=${RL_AGENT_AUTO_EXPORT:-false}
      - RL_AGENT_SEED=${RL_AGENT_SEED:-42}
      - RL_MODEL_OUTPUT_PATH=/app/control_plane/rl_agent/artifacts/rl_agent_linear.json
    volumes:
      - ./control_plane/rl_agent/artifacts:/app/control_plane/rl_agent/artifacts
    networks:
      - adaptive_net
    restart: unless-stopped
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3

  routing_controller:
    build:
      context: .
      dockerfile: control_plane/routing_controller/Dockerfile
    container_name: adaptive-routing-controller
    ports:
      - "8001:8001"
    environment:
      - RL_MODEL_PATH=/app/control_plane/rl_agent/artifacts/rl_agent_linear.json
      - RL_POLICY_MODE=${RL_POLICY_MODE:-heuristic}
      - HEURISTIC_ROUTE_THRESHOLD=${HEURISTIC_ROUTE_THRESHOLD:-0.45}
      - L4_ROUTING_ENABLED=false
      - ROUTING_UPDATE_SCRIPT=/app/gateway/routing_update.sh
      - ROUTING_COMMAND_TIMEOUT=5
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
    volumes:
      - ./control_plane/rl_agent/artifacts:/app/control_plane/rl_agent/artifacts
      - haproxy_maps:/etc/haproxy/maps
      - haproxy_sock:/var/run/haproxy
    depends_on:
      - gateway
    networks:
      - adaptive_net
    restart: unless-stopped
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3

  llm_analyzer:
    build:
      context: .
      dockerfile: control_plane/llm_analyzer/Dockerfile
    container_name: adaptive-llm-analyzer
    ports:
      - "8002:8002"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=honeypot-logs-*
      - ROUTING_CONTROLLER_URL=http://routing_controller:8001
      - ANALYZER_INTERVAL_SECONDS=${ANALYZER_INTERVAL_SECONDS:-2}
      - ANALYZER_WINDOW_SECONDS=${ANALYZER_WINDOW_SECONDS:-300}
      - ANALYZER_APPLY_ROUTE=${ANALYZER_APPLY_ROUTE:-true}
      - ANALYZER_ENABLED=${ANALYZER_ENABLED:-true}
      - EXPOSURE_MODE=${EXPOSURE_MODE:-debug}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      - elasticsearch
      - routing_controller
    networks:
      - adaptive_net
    restart: unless-stopped
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3

  # ============================================================
  # OBSERVABILITY - SIEM & Monitoring
  # ============================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: adaptive-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.watcher.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./observability/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    networks:
      - adaptive_net
    restart: unless-stopped
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: adaptive-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - SERVER_NAME=kibana
      - xpack.security.enabled=false
      - telemetry.enabled=false
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./observability/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - adaptive_net
    depends_on:
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: curl -s http://localhost:5601/app/kibana >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: adaptive-filebeat
    user: root
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
    ports:
      - "5140:5140/udp"
      - "5141:5141/udp"
    networks:
      - adaptive_net
    depends_on:
      - elasticsearch
    restart: unless-stopped
    command: filebeat -e -strict.perms=false
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    healthcheck:
      test: filebeat test config -c /usr/share/filebeat/filebeat.yml -strict.perms=false
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================
# NETWORKS & VOLUMES
# ============================================================

networks:
  adaptive_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

volumes:
  backend_data:
  haproxy_maps:
  haproxy_sock:
  elasticsearch_data:
  filebeat_data:
